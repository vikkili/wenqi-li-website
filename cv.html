<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#FAFAF8;--surface:#FFFFFF;--border:#E8E6EE;
--accent:#6B5CE7;--accent2:#9B8FE8;
--text:#2D2B35;--text-dim:#6B6880;--text-muted:#A09CB0;
--cjk:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC';
--font-body:'IBM Plex Sans',var(--cjk),sans-serif;
--font-head:'Outfit',var(--cjk),sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:17px;line-height:1.6;overflow-x:hidden;display:flex;flex-direction:column;min-height:100vh}

/* I18N */
html[data-lang="en"] .lang-zh{display:none!important}
html[data-lang="zh"] .lang-en{display:none!important}

/* ── Nav ── */
nav{position:sticky;top:0;left:0;right:0;z-index:100;flex-shrink:0;
background:rgba(250,250,248,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
nav .inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:56px}
nav .logo{font-family:var(--font-head);font-weight:700;font-size:18px;color:var(--text);text-decoration:none;letter-spacing:-.02em}
nav .nav-right{display:flex;align-items:center;gap:22px}
nav .links{display:flex;gap:24px}
nav .links a{font-size:14px;font-weight:500;color:var(--text-dim);text-decoration:none;transition:color .2s;position:relative}
nav .links a:hover,nav .links a.active{color:var(--accent)}
nav .links a.active::after{content:'';position:absolute;bottom:-18px;left:0;right:0;height:2px;background:var(--accent)}
.lang-toggle{padding:5px 11px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);font-family:var(--font-body);font-size:11.5px;font-weight:600;letter-spacing:.08em;cursor:pointer;transition:color .2s,border-color .2s}
.lang-toggle:hover{color:var(--accent);border-color:var(--accent)}

/* ── Toolbar ── */
.cv-bar{flex-shrink:0;max-width:1100px;width:100%;margin:0 auto;padding:20px 32px 14px;
display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.cv-bar h1{font-family:var(--font-head);font-size:24px;font-weight:600;letter-spacing:-.02em}
.cv-actions{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 18px;
border:1.5px solid var(--accent);color:var(--accent);background:transparent;
font-family:var(--font-head);font-weight:600;font-size:13px;text-decoration:none;
transition:background .25s,color .25s;white-space:nowrap}
.btn:hover{background:var(--accent);color:#FFF}
.btn svg{width:14px;height:14px;fill:currentColor}
.btn.ghost{border-color:var(--border);color:var(--text-dim)}
.btn.ghost:hover{background:transparent;border-color:var(--accent);color:var(--accent)}

/* ── Viewer ── */
.cv-viewer{flex:1 1 auto;max-width:1100px;width:100%;margin:0 auto;padding:0 32px 32px;
display:flex;min-height:540px}
.cv-frame{flex:1 1 auto;width:100%;border:1px solid var(--border);background:var(--surface);
box-shadow:0 2px 16px rgba(45,43,53,.06)}
.cv-fallback{padding:48px 32px;text-align:center;color:var(--text-dim);font-size:15px}

/* ── Footer ── */
footer{flex-shrink:0;text-align:center;padding:20px 32px;border-top:1px solid var(--border);color:var(--text-muted);font-size:13px}

/* ── Responsive ── */
@media(max-width:900px){
nav .inner{padding:0 20px}
nav .links{gap:16px}
.cv-bar{padding:18px 20px 12px}
.cv-viewer{padding:0 20px 20px}
}
@media(max-width:640px){
.cv-viewer{min-height:0;height:72vh}
nav .links{gap:12px}
nav .links a{font-size:12.5px}
nav .nav-right{gap:12px}
.cv-bar h1{font-size:20px}
}
</style>
</head>
<body>

<nav>
<div class="inner">

</div>

<a class="btn" href="Wenqi_Li_CV.pdf" download>

<p>&copy; 2026 <span class="lang-en">Wenqi Li · Peking University</span><span class="lang-zh">李文琦 · 北京大学</span></p>
</footer>

<script>
(function(){
  var root=document.documentElement,titleEl=document.querySelector('title'),descEl=document.querySelector('meta[name="description"]');
  function apply(l){
    root.setAttribute('data-lang',l);
    root.setAttribute('lang',l==='zh'?'zh-CN':'en');
    if(titleEl&&titleEl.getAttribute('data-'+l))document.title=titleEl.getAttribute('data-'+l);
    if(descEl&&descEl.getAttribute('data-'+l))descEl.setAttribute('content',descEl.getAttribute('data-'+l));
  }
  var saved=null;try{saved=localStorage.getItem('site-lang')}catch(e){}
  apply(saved==='zh'||saved==='en'?saved:(root.getAttribute('data-lang')||'en'));
  Array.prototype.forEach.call(document.querySelectorAll('.lang-toggle'),function(btn){
    btn.addEventListener('click',function(){
      var next=root.getAttribute('data-lang')==='en'?'zh':'en';
      try{localStorage.setItem('site-lang',next)}catch(e){}
      apply(next);
    });
  });
})();
</script>
