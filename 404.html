<title data-en="Page Not Found — Wenqi Li" data-zh="页面不存在 — 李文琦">Page Not Found — Wenqi Li</title>
<script>(function(){var l=null;try{l=localStorage.getItem('site-lang')}catch(e){}l=(l==='zh'||l==='en')?l:'en';var r=document.documentElement;r.setAttribute('data-lang',l);r.setAttribute('lang',l==='zh'?'zh-CN':'en')})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#FAFAF8;--surface:#FFFFFF;--border:#E8E6EE;
--accent:#6B5CE7;--accent2:#9B8FE8;
--text:#2D2B35;--text-dim:#6B6880;--text-muted:#A09CB0;
--cjk:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC';
--font-body:'IBM Plex Sans',var(--cjk),sans-serif;
--font-head:'Outfit',var(--cjk),sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:17px;line-height:1.6;overflow-x:hidden;display:flex;flex-direction:column;min-height:100vh}

html[data-lang="en"] .lang-zh{display:none!important}
html[data-lang="zh"] .lang-en{display:none!important}

nav{position:sticky;top:0;left:0;right:0;z-index:100;flex-shrink:0;
background:rgba(250,250,248,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
nav .inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:56px}
nav .logo{font-family:var(--font-head);font-weight:700;font-size:18px;color:var(--text);text-decoration:none;letter-spacing:-.02em}
nav .nav-right{display:flex;align-items:center;gap:22px}
nav .links{display:flex;gap:24px}
nav .links a{font-size:14px;font-weight:500;color:var(--text-dim);text-decoration:none;transition:color .2s}
nav .links a:hover{color:var(--accent)}
.lang-toggle{padding:5px 11px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);font-family:var(--font-body);font-size:11.5px;font-weight:600;letter-spacing:.08em;cursor:pointer;transition:color .2s,border-color .2s}
.lang-toggle:hover{color:var(--accent);border-color:var(--accent)}

main{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:64px 32px}
.nf{max-width:560px;text-align:center}
.nf .code{font-family:var(--font-head);font-size:clamp(72px,16vw,132px);font-weight:700;line-height:1;
letter-spacing:-.04em;color:var(--accent);opacity:.18}
.nf h1{font-family:var(--font-head);font-size:clamp(22px,4vw,30px);font-weight:600;letter-spacing:-.02em;margin-top:-.18em}
.nf p{color:var(--text-dim);font-size:15.5px;margin-top:16px}
.nf .links-row{margin-top:32px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{display:inline-flex;align-items:center;padding:8px 18px;
border:1.5px solid var(--accent);color:var(--accent);background:transparent;
font-family:var(--font-head);font-weight:600;font-size:13px;text-decoration:none;
transition:background .25s,color .25s;white-space:nowrap}
.btn:hover{background:var(--accent);color:#FFF}
.btn.ghost{border-color:var(--border);color:var(--text-dim)}
.btn.ghost:hover{background:transparent;border-color:var(--accent);color:var(--accent)}

footer{flex-shrink:0;text-align:center;padding:20px 32px;border-top:1px solid var(--border);color:var(--text-muted);font-size:13px}

@media(max-width:900px){nav .inner{padding:0 20px}nav .links{gap:16px}}
@media(max-width:640px){nav .links{gap:12px}nav .links a{font-size:12.5px}nav .nav-right{gap:12px}main{padding:48px 20px}}
</style>
</head>
<body>

<nav>
<div class="inner">
<a href="/index.html" class="logo"><span class="lang-en">Wenqi Li</span><span class="lang-zh">李文琦</span></a>
<div class="nav-right">
<div class="links">
<a href="/index.html"><span class="lang-en">Home</span><span class="lang-zh">首页</span></a>
<a href="/research.html"><span class="lang-en">Research</span><span class="lang-zh">科研</span></a>
<a href="/teaching.html"><span class="lang-en">Teaching</span><span class="lang-zh">教学</span></a>
<a href="/cv.html"><span class="lang-en">CV</span><span class="lang-zh">简历</span></a>
<a href="/about.html"><span class="lang-en">More About</span><span class="lang-zh">关于我</span></a>
</div>
<button class="lang-toggle" type="button" aria-label="Switch language / 切换语言"><span class="lang-en">中文</span><span class="lang-zh">EN</span></button>
</div>
</div>
</nav>

<main>
<div class="nf">
<div class="code">404</div>
<h1><span class="lang-en">This page doesn't exist</span><span class="lang-zh">页面不存在</span></h1>
<p>
<span class="lang-en">The address may be mistyped, or the page may have moved. The links below still work.</span>
<span class="lang-zh">可能是地址输错了，或者这个页面已经移走了。下面的链接仍然有效。</span>
</p>
<div class="links-row">
<a class="btn" href="/index.html"><span class="lang-en">Home</span><span class="lang-zh">返回首页</span></a>
<a class="btn ghost" href="/research.html"><span class="lang-en">Research</span><span class="lang-zh">科研</span></a>
<a class="btn ghost" href="/cv.html"><span class="lang-en">CV</span><span class="lang-zh">简历</span></a>
</div>
</div>
</main>

<footer>
<p>&copy; 2026 <span class="lang-en">Wenqi Li · Peking University</span><span class="lang-zh">李文琦 · 北京大学</span></p>
</footer>

<script>
(function(){
  var root=document.documentElement,titleEl=document.querySelector('title'),descEl=document.querySelector('meta[name="description"]');
  function apply(l){
    root.setAttribute('data-lang',l);
    root.setAttribute('lang',l==='zh'?'zh-CN':'en');
    if(titleEl&&titleEl.getAttribute('data-'+l))document.title=titleEl.getAttribute('data-'+l);
    if(descEl&&descEl.getAttribute('data-'+l))descEl.setAttribute('content',descEl.getAttribute('data-'+l));
  }
  var saved=null;try{saved=localStorage.getItem('site-lang')}catch(e){}
  apply(saved==='zh'||saved==='en'?saved:(root.getAttribute('data-lang')||'en'));
  Array.prototype.forEach.call(document.querySelectorAll('.lang-toggle'),function(btn){
    btn.addEventListener('click',function(){
      var next=root.getAttribute('data-lang')==='en'?'zh':'en';
      try{localStorage.setItem('site-lang',next)}catch(e){}
      apply(next);
    });
  });
})();
</script>
</body>
</html>
